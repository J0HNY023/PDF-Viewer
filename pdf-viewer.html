<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive PDF Editor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

    <h1>📄 Interactive PDF Editor</h1>
    <div class="disclaimer">
        <strong>How to use:</strong><br>
        ✏️ <strong>Add Text:</strong> Type your text in the blue bar, then click on the PDF to place it.<br>
        🧽 <strong>Whiteout:</strong> Click &amp; drag on the PDF to draw a box over text you want to erase.
    </div>

    <div class="toolbar">
        <label for="pdf-upload" class="btn btn-primary">📁 Upload PDF</label>
        <input type="file" id="pdf-upload" accept="application/pdf">

        <div class="separator"></div>

        <button id="btn-text" class="btn-tool active">✏️ Add Text</button>
        <button id="btn-whiteout" class="btn-tool">🧽 Whiteout</button>

        <div class="separator"></div>

        <button id="btn-prev" class="btn-tool">◀ Prev</button>
        <span class="page-info" id="page-info">Page 0 / 0</span>
        <button id="btn-next" class="btn-tool">Next ▶</button>

        <div class="separator"></div>

        <button id="btn-download" class="btn btn-success" disabled>💾 Download</button>
    </div>

    <!-- Text options bar (shown when Add Text mode is active) -->
    <div id="text-options" class="visible">
        <label for="toolbar-text-input">Text:</label>
        <input type="text" id="toolbar-text-input" placeholder="Type your text here...">
        <label for="font-size-select">Size:</label>
        <select id="font-size-select">
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="14" selected>14</option>
            <option value="18">18</option>
            <option value="24">24</option>
            <option value="32">32</option>
            <option value="48">48</option>
        </select>
        <label for="text-color">Color:</label>
        <input type="color" id="text-color" value="#000000">
        <span class="hint">← Then click on the PDF to place</span>
    </div>

    <div id="canvas-container">
        <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
